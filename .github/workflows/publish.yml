name: Publish to npm

# Runs when a GitHub release is published. The release tag must match package.json, e.g. v0.3.1.
# Uses npm trusted publishing (OIDC), so no npm token is stored in the repo: the package's settings on
# npmjs.com name this repository and this workflow file as its trusted publisher.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      - run: npm run build
      - name: Release tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$TAG" ]; then echo "Release tag $TAG does not match package.json ($version)"; exit 1; fi
      - name: Pack, install and run as a new user
        run: node scripts/verify-package.mjs
      # The first version was published by hand (trusted publishing can only be set up for a package that exists),
      # so a release for a version already on npm is not an error.
      - name: Publish unless this version is already on npm
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "debawho-brain-mcp@$version" version >/dev/null 2>&1; then echo "$version is already on npm"; else npm publish; fi
