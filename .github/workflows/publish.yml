name: Publish to npm

# Runs when a GitHub release is published. Bump the version in package.json and in both places in
# server.json, then release with a matching tag, e.g. v0.3.1.
# Uses npm trusted publishing (OIDC), so no npm token is stored in the repo: the package's settings on
# npmjs.com name this repository and this workflow file as its trusted publisher. The MCP Registry
# entry is published with the same GitHub OIDC token, which proves ownership of io.github.debashishthakur.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      - run: npm run build
      - name: Release tag matches package.json and server.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$TAG" ]; then echo "Release tag $TAG does not match package.json ($version)"; exit 1; fi
          node -e "const s=require('./server.json'), v=require('./package.json').version; if (s.version!==v || s.packages[0].version!==v) { console.error('server.json versions do not match package.json ' + v); process.exit(1) }"
      - name: Pack, install and run as a new user
        run: node scripts/verify-package.mjs
      # The first version was published by hand (trusted publishing can only be set up for a package that exists),
      # so a release for a version already on npm is not an error.
      - name: Publish unless this version is already on npm
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "debawho-brain-mcp@$version" version >/dev/null 2>&1; then echo "$version is already on npm"; else npm publish; fi
      - name: Publish to the MCP Registry unless this version is already there
        env:
          PUBLISHER: v1.8.1
        run: |
          version="$(node -p "require('./server.json').version")"
          # Ask for this exact version: the search endpoint's "latest" lags behind a fresh publish.
          code="$(curl -s -o /dev/null -w '%{http_code}' "https://registry.modelcontextprotocol.io/v0/servers/io.github.debashishthakur%2Fbrain-mcp/versions/$version")"
          if [ "$code" = "200" ]; then echo "$version is already in the MCP Registry"; exit 0; fi
          # The registry checks the npm package, and npm takes a minute or two to show a new version.
          for i in $(seq 1 30); do npm view "debawho-brain-mcp@$version" version >/dev/null 2>&1 && break; echo "waiting for npm to show $version"; sleep 20; done
          base="https://github.com/modelcontextprotocol/registry/releases/download/$PUBLISHER"
          curl -sSLO "$base/mcp-publisher_linux_amd64.tar.gz"
          curl -sSLO "$base/registry_${PUBLISHER#v}_checksums.txt"
          grep 'mcp-publisher_linux_amd64.tar.gz$' "registry_${PUBLISHER#v}_checksums.txt" | sha256sum -c -
          tar -xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
