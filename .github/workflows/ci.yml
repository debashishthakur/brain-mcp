name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Build and verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # The embedding and reranker models (about 300 MB) are downloaded once and cached.
      - uses: actions/cache@v6
        with:
          path: data/models
          key: models-${{ hashFiles('src/vault/dense.ts', 'brain.config.json') }}
      # onnxruntime-node's install script only fetches optional GPU binaries; the CPU runtime ships in the package.
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      - run: npm run build
      - run: npm run typecheck
      - name: Setup command (in a temp folder)
        run: node scripts/verify-setup.mjs
      # From here on a personal config exists, so every check below also proves it stays on the example vault.
      - name: Personal setup
        run: npm run setup -- --yes --name "CI Runner"
      - name: Smoke test (every tool over stdio)
        run: node scripts/smoke.mjs
      - name: Redaction, watcher, HTTP auth, audit
        run: node scripts/verify.mjs
      - name: Memory and identity
        run: node scripts/verify-memory.mjs
      - name: Write, edit, move and delete tools
        run: node scripts/verify-write.mjs
      - name: OAuth 2.1 flow
        run: node scripts/verify-oauth.mjs
      - name: Hybrid retrieval (models, refusal, spelling, identifiers)
        run: node scripts/verify-hybrid.mjs
      - name: Retrieval eval, keyword vs hybrid
        run: node scripts/eval-retrieval.mjs
      - name: Hard eval set
        run: node scripts/eval-hybrid.mjs
      - name: Vault is restored
        run: git diff --exit-code -- example-vault

  package:
    name: npm package on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      - run: npm run build
      # What `npx debawho-brain-mcp init` gives a new user: pack, install, init, serve, and no state in the package folder.
      - name: Pack, install and run as a new user
        run: node scripts/verify-package.mjs
